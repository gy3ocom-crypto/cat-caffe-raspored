const { useState, useEffect, useRef, useCallback } = React;


// ---------- shared cloud storage (2 baze + auto-zamjena; radi izmedu uredaja/racuna) ----------
let BLOB_ID = new URLSearchParams(location.search).get("b") || null;
let PROVIDER = new URLSearchParams(location.search).get("p") || "kvdb";
let DB = {};
// zapamti zadnji raspored na ovom uređaju, da se otvori i bez ?b= u linku
try {
  if (!BLOB_ID) { const last = JSON.parse(localStorage.getItem("catcafe_last") || "null"); if (last) { BLOB_ID = last.b; PROVIDER = last.p; history.replaceState(null, "", location.pathname + "?b=" + last.b + "&p=" + last.p); } }
  else localStorage.setItem("catcafe_last", JSON.stringify({ b: BLOB_ID, p: PROVIDER }));
} catch (e) {}
const PROVIDERS = {
  kvdb: {
    async create(init) {
      const r = await fetch("https://kvdb.io/", { method: "POST" });
      if (!r.ok) throw new Error("kvdb create");
      const id = (await r.text()).trim();
      if (!id || /\s/.test(id)) throw new Error("kvdb id");
      await fetch("https://kvdb.io/" + id + "/db", { method: "PUT", body: JSON.stringify(init) });
      return id;
    },
    async get(id) {
      const r = await fetch("https://kvdb.io/" + id + "/db");
      if (r.status === 404) return null;
      if (!r.ok) throw new Error("kvdb get");
      const t = await r.text();
      return t ? JSON.parse(t) : null;
    },
    async put(id, obj) { await fetch("https://kvdb.io/" + id + "/db", { method: "PUT", body: JSON.stringify(obj) }); },
  },
  jb: {
    async create(init) {
      const r = await fetch("https://jsonblob.com/api/jsonBlob", { method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" }, body: JSON.stringify(init) });
      if (!r.ok) throw new Error("jb create");
      const loc = r.headers.get("Location") || r.headers.get("location") || "";
      const id = loc.split("/").filter(Boolean).pop();
      if (!id) throw new Error("jb id");
      return id;
    },
    async get(id) { const r = await fetch("https://jsonblob.com/api/jsonBlob/" + id); if (!r.ok) throw new Error("jb get"); return await r.json(); },
    async put(id, obj) { await fetch("https://jsonblob.com/api/jsonBlob/" + id, { method: "PUT", headers: { "Content-Type": "application/json", "Accept": "application/json" }, body: JSON.stringify(obj) }); },
  },
  // rezerva: ako nijedna online baza ne radi, spremi na ovaj uređaj
  local: {
    async create(init) { const id = "l" + Math.random().toString(36).slice(2, 10); localStorage.setItem("catcafe_" + id, JSON.stringify(init)); return id; },
    async get(id) { const t = localStorage.getItem("catcafe_" + id); return t ? JSON.parse(t) : null; },
    async put(id, obj) { localStorage.setItem("catcafe_" + id, JSON.stringify(obj)); },
  },
};
function prov() { return PROVIDERS[PROVIDER] || PROVIDERS.kvdb; }
async function refreshDB() { if (!BLOB_ID) return; try { const d = await prov().get(BLOB_ID); if (d) DB = d; } catch (e) {} }
async function persist() { if (!BLOB_ID) return; try { await prov().put(BLOB_ID, DB); } catch (e) {} }
async function sGet(k) { return (DB && (k in DB)) ? DB[k] : null; }
async function sSet(k, v) { try { DB[k] = v; await persist(); return true; } catch { return false; } }
async function createStore(init) {
  for (const p of ["kvdb", "jb", "local"]) {
    try { const id = await PROVIDERS[p].create(init); if (id) { PROVIDER = p; BLOB_ID = id; DB = init; return { id, p }; } } catch (e) {}
  }
  return null;
}

// ---------- constants ----------
const DAYS = ["Pon", "Uto", "Sri", "Čet", "Pet", "Sub", "Ned"];
const DAYS_LONG = ["Ponedjeljak", "Utorak", "Srijeda", "Četvrtak", "Petak", "Subota", "Nedjelja"];

const TYPES = [
  { id: "P", label: "Prijepodne", from: "11:00", to: "16:00", color: "bg-amber-100 text-amber-900 border-amber-300" },

const typeDef = (id) => TYPES.find((t) => t.id === id) || TYPES[TYPES.length - 1];
// stare fiksne smjene (prije je svaki dan imao ove tri)
const LEGACY_SHIFTS = [["jutarnja", "Jutarnja", "08:00", "15:00"], ["srednja", "Srednja", "13:00", "21:00"], ["vecernja", "Večernja", "15:00", "23:00"]];
const itemLabel = (it) => it.label || typeDef(it.type).label;
const itemTime = (it) => (it.from || it.to ? `${(it.from || "").replace(":00", "")}–${(it.to || "").replace(":00", "")}` : "");
function mins(t) { const m = /^(\d{1,2}):(\d{2})$/.exec(t || ""); return m ? +m[1] * 60 + +m[2] : null; }
function itemHours(it) { const a = mins(it.from), b = mins(it.to); return a == null || b == null || b <= a ? 0 : (b - a) / 60; }
function newItemId() { return "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }

];
const FERIJE = [
  ["2026-01-01", "2026-01-09"], ["2026-03-30", "2026-04-06"],
  ["2026-06-15", "2026-09-06"], ["2026-12-24", "2027-01-06"],
];

// id-jevi ostaju isti kao u prošloj verziji (p0 je bila Vedrana), da se već upisani podaci ne pomiješaju
const DEFAULT_ROSTER = [
  ["Inoslav", "stalni"], ["Terra", "stalni"],
  ["Nives", "student"], ["Hana", "student"], ["Nikol", "student"], ["Viktorija", "student"], ["Lucija", "student"], ["Ena", "student"], ["Boris", "student"],
].map(([name, role], i) => ({ id: "p" + (i + 1), name, role, phone: "", email: "", sanIssued: "", sanExpiry: "" }));
// timovi koje je aplikacija prije stavljala sama; takav spremljeni tim zamijeni novim
const OLD_DEFAULT_NAMES = "Vedrana,Jana,Inoslav,Patricija,Terra,Ivan,Agneza,Nives,Ena,Jelena,Roko,Lucija";
const PREV_DEFAULT_NAMES = "Vedrana,Inoslav,Terra,Nives,Hana,Nikol,Viktorija,Lucija,Ena,Boris";
function fixRoster(pr) {
  const names = pr.map((x) => x.name).join(",");
  if (names === OLD_DEFAULT_NAMES) return DEFAULT_ROSTER;
  if (names === PREV_DEFAULT_NAMES) return pr.filter((x) => x.name !== "Vedrana");
  return pr;
}

// ---------- date helpers (local time) ----------
function key(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function parseIso(iso) { return new Date(iso + "T00:00:00"); }
function mondayOf(d) { const x = new Date(d); const wd = (x.getDay() + 6) % 7; x.setDate(x.getDate() - wd); x.setHours(0, 0, 0, 0); return x; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function shortHR(d) { return `${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}.`; }
function dayIdxOf(iso) { return (parseIso(iso).getDay() + 6) % 7; }
function holidayFor(iso) { return HOLIDAYS.find((h) => h.date === iso) || null; }
function isFerije(iso) { return FERIJE.some(([a, b]) => iso >= a && iso <= b); }
function datesBetween(a, b) { const o = []; let c = parseIso(a); const e = parseIso(b); while (c <= e) { o.push(key(c)); c = addDays(c, 1); } return o; }
// tjedni prepisani iz rasporeda s WhatsAppa; vrijede dok admin ne spremi svoju verziju tog tjedna
// [dan 0-6, vrsta, od, do, imena…]
const SEED_WEEKS = {
  "2026-09-21": [
    [0, "P", "11:00", "16:00", "Nives"], [0, "C", "11:00", "13:00", "Viktorija"], [0, "D", "16:00", "22:00", "Inoslav", "Nikol"],
    [1, "P", "11:00", "16:00", "Inoslav"], [1, "C", "11:00", "13:00", "Viktorija"], [1, "D", "16:00", "22:00", "Nives", "Nikol"],
    [2, "P", "11:00", "16:00", "Inoslav"], [2, "D", "16:00", "22:00", "Nives", "Hana"],
    [3, "P", "11:00", "16:00", "Inoslav", "Nikol"], [3, "D", "16:00", "22:00", "Nives", "Hana"],
    [4, "P", "11:00", "16:00", "Nives", "Viktorija"], [4, "D", "16:00", "22:00", "Inoslav", "Hana"],
    [5, "P", "11:00", "16:00", "Nives", "Viktorija"], [5, "M", "14:00", "20:00", "Lucija"], [5, "D", "16:00", "22:00", "Boris", "Nikol"],
    [6, "P", "11:00", "16:00", "Nives", "Lucija"], [6, "D", "16:00", "22:00", "Boris", "Hana"],
  ],
  "2026-09-28": [
    [0, "P", "11:00", "16:00", "Inoslav"], [0, "C", "11:00", "13:00", "Nives"], [0, "D", "16:00", "22:00", "Nikol", "Viktorija"],
    [1, "P", "11:00", "16:00", "Inoslav"], [1, "D", "16:00", "22:00", "Terra", "Viktorija"],
    [2, "P", "11:00", "16:00", "Inoslav"], [2, "D", "16:00", "22:00", "Terra", "Hana"],
    [3, "P", "11:00", "16:00", "Inoslav", "Nikol"], [3, "D", "16:00", "22:00", "Terra", "Hana"],
    [4, "P", "11:00", "16:00", "Inoslav"], [4, "C", "11:00", "13:00", "Nives"], [4, "D", "16:00", "22:00", "Nives", "Hana"],
    [5, "P", "11:00", "16:00", "Terra", "Nikol"], [5, "D", "16:00", "22:00", "Nives", "Lucija"],
    [6, "P", "11:00", "16:00", "Nikol", "Lucija"], [6, "D", "16:00", "22:00", "Nives", "Hana"],
  ],
};
function seedWeek(wk, roster) {
  const w = emptyWeek(); const rows = SEED_WEEKS[wk]; if (!rows) return w;
  rows.forEach(([d, type, from, to, ...names], n) => {
    const people = names.map((nm) => (roster.find((r) => r.name === nm) || {}).id).filter(Boolean);
    w[d].push({ id: `s${wk}-${n}`, type, label: "", from, to, note: "", people });
  });
  return w;
}
const weekFrom = (raw, wk, roster) => (raw ? safeWeek(raw) : seedWeek(wk, roster));

// tjedan = { 0..6: [ { id, type, label, from, to, note, people: [id…] } ] }
function emptyWeek() { const w = {}; for (let i = 0; i < 7; i++) w[i] = []; return w; }
function safeWeek(raw) {
  try {
    const w = JSON.parse(raw); const o = emptyWeek();
    for (let i = 0; i < 7; i++) {
      const d = w[i]; if (!d) continue;
      if (Array.isArray(d)) o[i] = d.map((it) => ({ id: it.id || newItemId(), type: it.type || "O", label: it.label || "", from: it.from || "", to: it.to || "", note: it.note || "", people: Array.isArray(it.people) ? it.people : [] }));
      else LEGACY_SHIFTS.forEach(([id, label, from, to]) => { if ((d[id] || []).length) o[i].push({ id, type: "O", label, from, to, note: "", people: d[id] }); });
    }
    return o;
  } catch { return emptyWeek(); }
}
function daysTo(iso) { if (!iso) return null; return Math.round((parseIso(iso) - new Date(key(new Date()) + "T00:00:00")) / 86400000); }

function App() {
  const [me, setMe] = useState(null);
  const [pins, setPins] = useState({});
  const [pending, setPending] = useState(null);
  const [pinIn, setPinIn] = useState("");
  const [pinIn2, setPinIn2] = useState("");
  const [pinErr, setPinErr] = useState("");
  const [tab, setTab] = useState("raspored");
  const [weekStart, setWeekStart] = useState(() => mondayOf(new Date()));
  const [roster, setRoster] = useState(DEFAULT_ROSTER);
  const [week, setWeek] = useState(emptyWeek());
  const [leave, setLeave] = useState({});
  const [swaps, setSwaps] = useState([]);
  const [notes, setNotes] = useState("");
  const [loading, setLoading] = useState(true);
  const [status, setStatus] = useState("");
  const [lastSync, setLastSync] = useState(null);
  const [picker, setPicker] = useState(null);
  const [extraSlots, setExtraSlots] = useState([]);
  const [leaveDraft, setLeaveDraft] = useState({});
  const [swapDraft, setSwapDraft] = useState({ mutual: false });
  const [expanded, setExpanded] = useState(null);
  const [newName, setNewName] = useState("");
  const [newRole, setNewRole] = useState("stalni");
  const notesFocused = useRef(false);
  const weekKey = key(weekStart);
  const canEdit = ADMINS.includes(me);
  const flash = (t) => { setStatus(t); setTimeout(() => setStatus(""), 1500); };

  const loadAll = useCallback(async (silent) => {
    if (!silent) setLoading(true);
    await refreshDB();
    const [r, w, n, l, s, pin] = await Promise.all([sGet("roster"), sGet(`week:${weekKey}`), sGet(`notes:${weekKey}`), sGet("leave"), sGet("swaps"), sGet("pins")]);
    if (pin) { try { setPins(JSON.parse(pin)); } catch {} }
    let ro = DEFAULT_ROSTER;
    if (r) { try { const pr = JSON.parse(r); ro = fixRoster(pr); setRoster(ro); if (ro !== pr) await sSet("roster", JSON.stringify(ro)); } catch {} } else if (!silent) await sSet("roster", JSON.stringify(DEFAULT_ROSTER));
    setWeek(weekFrom(w, weekKey, ro));
    if (!notesFocused.current) setNotes(n || "");
    if (l) { try { setLeave(JSON.parse(l)); } catch {} }
    if (s) { try { setSwaps(JSON.parse(s)); } catch {} }
    setLastSync(new Date());
    if (!silent) setLoading(false);
  }, [weekKey]);

  useEffect(() => { loadAll(false); }, [loadAll]);
  useEffect(() => { const t = setInterval(() => { if (!picker) loadAll(true); }, 12000); return () => clearInterval(t); }, [loadAll, picker]);

  async function saveWeek(next) { setWeek(next); const ok = await sSet(`week:${weekKey}`, JSON.stringify(next)); flash(ok ? "spremljeno ✓" : "greška"); setLastSync(new Date()); }
  async function saveRoster(next) { setRoster(next); await sSet("roster", JSON.stringify(next)); flash("tim ✓"); }
  async function saveNotes() { const ok = await sSet(`notes:${weekKey}`, notes); flash(ok ? "napomene ✓" : "greška"); }
  async function saveLeave(next) { setLeave(next); await sSet("leave", JSON.stringify(next)); flash("godišnji ✓"); }
  async function saveSwaps(next) { setSwaps(next); await sSet("swaps", JSON.stringify(next)); }

  const member = (id) => roster.find((r) => r.id === id) || {};
  const nameOf = (id) => member(id).name || "?";
  const roleOf = (id) => member(id).role || "";
  const idOfName = (nm) => (roster.find((r) => r.name === nm) || {}).id || "";
  const onLeave = (id, iso) => (leave[id] || []).includes(iso);

  function editItems(dayIdx, fn) {
    if (!canEdit) return;
    const next = JSON.parse(JSON.stringify(week));
    next[dayIdx] = fn(next[dayIdx]) || next[dayIdx];
    saveWeek(next);
  }
  function togglePerson(dayIdx, itemId, pid) {
    editItems(dayIdx, (items) => { const it = items.find((x) => x.id === itemId); if (!it) return; const at = it.people.indexOf(pid); if (at >= 0) it.people.splice(at, 1); else it.people.push(pid); });
  }
  // tap na polje tablice: otvori postojeću stavku ili napravi novu za taj termin
  function openCell(dayIdx, slot, item, iso) {
    if (item) { setPicker({ day: dayIdx, item: item.id, iso }); return; }
    const t = TYPES.find((x) => x.from === slot[0] && x.to === slot[1]); const id = newItemId();
    editItems(dayIdx, (items) => [...items, { id, type: t ? t.id : "O", label: slot[2] || "", from: slot[0], to: slot[1], note: "", people: [] }]);
    setPicker({ day: dayIdx, item: id, iso });
  }
  function addSlot() {
    const sl = parseSlot(prompt("Novi termin, npr. 14-20 ili 19-22 kviz") || "");
    if (!sl) return;
    setExtraSlots([...extraSlots, sl]);
  }
  function updateItem(dayIdx, itemId, patch) { editItems(dayIdx, (items) => items.map((x) => (x.id === itemId ? { ...x, ...patch } : x))); }
  function removeItem(dayIdx, itemId) { editItems(dayIdx, (items) => items.filter((x) => x.id !== itemId)); setPicker(null); }
  function closePicker() {
    const it = picker && (week[picker.day] || []).find((x) => x.id === picker.item);
    if (it && !it.people.length && !it.note) editItems(picker.day, (items) => items.filter((x) => x.id !== it.id));
    setPicker(null);
  }
  async function copyPrevWeek() {
    if (!canEdit) return;
    const has = Object.values(week).some((d) => d.length);
    if (has && !confirm("Ovaj tjedan već ima unosa. Zamijeniti ga prošlim tjednom?")) return;
    const pk = key(addDays(weekStart, -7)); const raw = await sGet(`week:${pk}`);
    const w = weekFrom(raw, pk, roster);
    if (!Object.values(w).some((d) => d.length)) { flash("prošli tjedan je prazan"); return; } for (let i = 0; i < 7; i++) w[i] = w[i].map((it) => ({ ...it, id: newItemId() }));
    saveWeek(w);
  }

  // kasna smjena (do 22 ili kasnije) pa rana (od 11 ili ranije) sljedeći dan
  function conflicts(pid) {
    const o = [];
    for (let d = 0; d < 6; d++) {
      const late = week[d].some((it) => it.people.includes(pid) && (mins(it.to) ?? 0) >= 22 * 60);
      const early = week[d + 1].some((it) => it.people.includes(pid) && mins(it.from) != null && mins(it.from) <= 11 * 60);
      if (late && early) o.push(d);
    }
    return o;
  }
  function holidayShifts(pid) { let c = 0; for (let i = 0; i < 7; i++) { const h = holidayFor(key(addDays(weekStart, i))); if (h && !h.closed) week[i].forEach((it) => { if (it.people.includes(pid)) c++; }); } return c; }
  const summary = roster.map((p) => { let c = 0, hrs = 0; for (let i = 0; i < 7; i++) week[i].forEach((it) => { if (it.people.includes(p.id)) { c++; hrs += itemHours(it); } }); return { ...p, count: c, hours: hrs, conflicts: conflicts(p.id), holiday: holidayShifts(p.id) }; });

  function leaveUsed(pid) { return (leave[pid] || []).filter((iso) => { if (holidayFor(iso)) return false; return parseIso(iso).getDay() !== 0; }).length; }
  function addLeave(pid) {
    if (!canEdit) return;
    const d = leaveDraft[pid] || {}; if (!d.od) return; const to = d.do || d.od; if (to < d.od) return;
    const cur = new Set(leave[pid] || []); datesBetween(d.od, to).forEach((x) => cur.add(x));
    saveLeave({ ...leave, [pid]: Array.from(cur).sort() }); setLeaveDraft({ ...leaveDraft, [pid]: {} });
  }
  function removeLeaveDate(pid, iso) { if (!canEdit) return; saveLeave({ ...leave, [pid]: (leave[pid] || []).filter((x) => x !== iso) }); }

  function updateMember(id, field, val) { saveRoster(roster.map((r) => (r.id === id ? { ...r, [field]: val } : r))); }
  function addPerson() { if (!canEdit) return; const nm = newName.trim(); if (!nm) return; saveRoster([...roster, { id: "x" + Date.now(), name: nm, role: newRole, phone: "", email: "", sanIssued: "", sanExpiry: "" }]); setNewName(""); }
  function removePerson(id) {
    if (!canEdit) return;
    saveRoster(roster.filter((r) => r.id !== id));
    const next = JSON.parse(JSON.stringify(week));
    for (let i = 0; i < 7; i++) next[i].forEach((it) => { it.people = it.people.filter((x) => x !== id); });
    saveWeek(next);
  }

  // ----- swaps (peer-confirmed, no admin) -----
  async function editDate(iso, mut) {
    const wk = key(mondayOf(parseIso(iso)));
    const raw = await sGet(`week:${wk}`); const w = weekFrom(raw, wk, roster);
    mut(w[dayIdxOf(iso)]); await sSet(`week:${wk}`, JSON.stringify(w));
    if (wk === weekKey) setWeek(JSON.parse(JSON.stringify(w)));
  }
  // zamjena: osoba a predaje osobi b sve svoje stavke tog dana (ili samo onu jednu, kod starih zahtjeva)
  function replaceIn(items, shiftId, a, b) {
    items.forEach((it) => { if (shiftId && it.id !== shiftId) return; const i = it.people.indexOf(a); if (i < 0) return; it.people.splice(i, 1); if (!it.people.includes(b)) it.people.push(b); });
  }

  async function applySwap(sw) {
    await editDate(sw.fromDate, (day) => replaceIn(day, sw.fromShift, sw.fromPerson, sw.toPerson));
    if (sw.mutual && sw.toDate) await editDate(sw.toDate, (day) => replaceIn(day, sw.toShift, sw.toPerson, sw.fromPerson));
  }
  const shiftName = (id) => { const l = LEGACY_SHIFTS.find((x) => x[0] === id); return l ? l[1] : ""; };
  function createSwap() {
    const d = swapDraft;
    if (!d.fromPerson || !d.fromDate || !d.toPerson) { flash("ispuni sva polja"); return; }
    if (d.fromPerson === d.toPerson) { flash("iste osobe"); return; }
    const sw = {
      id: "sw" + Date.now(), fromPerson: d.fromPerson, fromDate: d.fromDate, fromShift: "",
      toPerson: d.toPerson, mutual: !!d.mutual, toDate: d.mutual ? d.toDate : "", toShift: "",
      confirmFrom: true, confirmTo: false, status: "pending", ts: Date.now(),
    };
    saveSwaps([sw, ...swaps]);
    setSwapDraft({ mutual: false });
    flash("zahtjev poslan");
  }
  async function confirmSwap(id) {
    const sw = swaps.find((x) => x.id === id); if (!sw) return;
    await applySwap(sw);
    saveSwaps(swaps.map((x) => (x.id === id ? { ...x, confirmTo: true, status: "done" } : x)));
    flash("zamjena potvrđena ✓");
  }
  function rejectSwap(id) { saveSwaps(swaps.map((x) => (x.id === id ? { ...x, status: "rejected" } : x))); }
  function deleteSwap(id) { saveSwaps(swaps.filter((x) => x.id !== id)); }

  const isThisWeek = key(mondayOf(new Date())) === weekKey;
  const pickItem = picker ? (week[picker.day] || []).find((x) => x.id === picker.item) : null;
  const printWeek = () => window.print();

  async function savePins(next) { setPins(next); await sSet("pins", JSON.stringify(next)); }
  function selectName(name) { setPinErr(""); setPinIn(""); setPinIn2(""); if (name === "__viewer") { setMe("__viewer"); return; } setPending(name); }
  async function submitPin() {
    const has = !!pins[pending];
    if (has) {
      if (pinIn === pins[pending]) { setMe(pending); setPending(null); }
      else setPinErr("pogrešan PIN");
    } else {
      if (pinIn.length < 4) { setPinErr("PIN min. 4 znamenke"); return; }
      if (pinIn !== pinIn2) { setPinErr("PIN se ne podudara"); return; }
      await savePins({ ...pins, [pending]: pinIn });
      setMe(pending); setPending(null);
    }
    setPinIn(""); setPinIn2("");
  }
  function logout() { setMe(null); setPending(null); setPinIn(""); setPinIn2(""); setPinErr(""); }
  function resetMemberPin(name) { if (!canEdit) return; const n = { ...pins }; delete n[name]; savePins(n); flash("PIN resetiran"); }

  // ---------- identity / PIN gate ----------
  if (!me) {
    const names = ["Robert", ...roster.map((p) => p.name).filter((n) => n !== "Robert")];
    const hasPin = pending && !!pins[pending];
    return (
      <div className="min-h-screen bg-stone-900 text-stone-50 flex flex-col items-center justify-center p-6" style={{ fontFamily: "Georgia,serif" }}>
        <style>{`@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&display=swap');.display{font-family:'Fraunces',Georgia,serif}`}</style>
        <div className="flex items-end gap-2 mb-3"><CatSit size={52} white /><Soot size={30} style={{ marginBottom: 6 }} /><CatSit size={64} /><CatFace size={46} /></div>
        <div className="display text-2xl font-bold mb-1">Cat Cafe · Raspored</div>
        {!pending ? (
          <>
            <div className="text-stone-400 text-sm mb-6">Tko si?</div>
            <div className="w-full max-w-xs space-y-2 max-h-[70vh] overflow-y-auto">
              {names.map((nm) => {
                const isAdmin = ADMINS.includes(nm);
                const set = !!pins[nm];
                return (
                  <button key={nm} onClick={() => selectName(nm)}
                    className={`w-full py-2.5 rounded-xl flex items-center justify-between px-4 ${isAdmin ? "bg-amber-600 text-white font-semibold" : "bg-stone-700 text-stone-100"}`}>
                    <span>{nm}{isAdmin ? " · admin" : ""}</span>
                    <span className="text-[11px] opacity-70">{set ? "🔒" : "novi PIN"}</span>
                  </button>
                );
              })}
              <button onClick={() => selectName("__viewer")} className="w-full py-2.5 rounded-xl border border-stone-600 text-stone-300">Samo gledam (bez PIN-a)</button>
            </div>
          </>
        ) : (
          <div className="w-full max-w-xs">
            <div className="text-center text-stone-300 mb-1">{pending}</div>
            <div className="text-center text-stone-400 text-xs mb-4">{hasPin ? "Unesi svoj PIN" : "Postavi novi PIN (min. 4 znamenke)"}</div>
            <input autoFocus type="password" inputMode="numeric" value={pinIn} onChange={(e) => { setPinIn(e.target.value); setPinErr(""); }}
              placeholder="PIN" className="w-full text-center tracking-widest bg-stone-800 border border-stone-600 rounded-xl py-3 text-lg mb-2 focus:outline-none" />
            {!hasPin && (
              <input type="password" inputMode="numeric" value={pinIn2} onChange={(e) => { setPinIn2(e.target.value); setPinErr(""); }}
                placeholder="ponovi PIN" className="w-full text-center tracking-widest bg-stone-800 border border-stone-600 rounded-xl py-3 text-lg mb-2 focus:outline-none" />
            )}
            {pinErr && <div className="text-red-400 text-xs text-center mb-2">{pinErr}</div>}
            <button onClick={submitPin} className="w-full py-3 rounded-xl bg-amber-500 text-stone-900 font-bold mb-2">{hasPin ? "Ulaz" : "Spremi i uđi"}</button>
            <button onClick={() => { setPending(null); setPinErr(""); }} className="w-full py-2 rounded-xl border border-stone-600 text-stone-400 text-sm">‹ natrag</button>
          </div>
        )}
      </div>
    );
  }

  const meLabel = me === "__viewer" ? "pregled" : me;
  const TabBtn = ({ id, label }) => (
    <button onClick={() => setTab(id)} className={`px-3 py-2 text-sm rounded-lg whitespace-nowrap flex items-center gap-1 ${tab === id ? "bg-amber-400 text-stone-900 font-bold" : "bg-stone-700 text-stone-200"}`} style={{ fontFamily: "'Patrick Hand',system-ui,sans-serif", fontSize: 16 }}>{tab === id && <Paw size={13} />}{label}</button>
  );

  return (
    <div className="min-h-screen text-stone-800" style={{ fontFamily: "Georgia,'Times New Roman',serif", backgroundColor: "#faf6ee", backgroundImage: PAW_BG }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Patrick+Hand&display=swap');
        .display{font-family:'Fraunces',Georgia,serif}
        body{-webkit-tap-highlight-color:transparent}
        .print-area{display:none}
        @media print{.screen{display:none!important}.print-area{display:block!important;padding:16px;font-family:Georgia,serif;color:#000}
          .pt{width:100%;border-collapse:collapse}.pt td,.pt th{border:1px solid #444;padding:6px 8px;font-size:12px;text-align:left;vertical-align:top}
          .pt th{background:#eee}}
      `}</style>

      {/* ===== SCREEN ===== */}
      <div className="screen">
        {/* header */}
        <div className="bg-stone-900 text-stone-50 px-4 py-3 sticky top-0 z-20 shadow-md">
          <div className="flex items-center justify-between mb-2">
            <div>
              <div className="display text-xl font-bold leading-none flex items-end gap-1.5"><CatSit size={22} white style={{ marginBottom: -2 }} />Cat Cafe · Raspored<Soot size={14} /></div>
              <div className="text-[11px] text-stone-400 mt-1">
                {lastSync ? `osvježeno ${lastSync.toLocaleTimeString("hr-HR", { hour: "2-digit", minute: "2-digit" })}` : "…"}
                {status && <span className="text-emerald-400 ml-2">{status}</span>}
              </div>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={logout} className="text-[11px] bg-stone-700 active:bg-stone-600 px-2 py-2 rounded-lg">{meLabel} ▾</button>
              <button onClick={() => loadAll(false)} className="text-xs bg-stone-700 active:bg-stone-600 px-3 py-2 rounded-lg">↻</button>
            </div>
          </div>
          <div className="flex gap-2 overflow-x-auto pb-1">
            <TabBtn id="raspored" label="Raspored" /><TabBtn id="zamjene" label="Zamjene" />
            <TabBtn id="sati" label="Sati" /><TabBtn id="kasa" label="Blagajna" />
            <TabBtn id="godisnji" label="Godišnji" /><TabBtn id="tim" label="Tim" /><TabBtn id="upute" label="Upute" />
          </div>
        </div>

        {!canEdit && tab !== "zamjene" && tab !== "upute" && tab !== "kasa" && tab !== "sati" && (
          <div className="bg-amber-50 border-b border-amber-200 text-amber-800 text-[12px] px-4 py-2">
            Pregled — raspored uređuje Robert. Zamjene smjena možeš tražiti i potvrđivati sam.
          </div>
        )}

        {loading ? <div className="p-8 text-center text-stone-400">učitavam…</div> :
          tab === "raspored" ? (
            <>
              <div className="px-4 py-3 flex items-center justify-between bg-white border-b border-stone-200">
                <button onClick={() => setWeekStart(addDays(weekStart, -7))} className="px-3 py-2 rounded-lg bg-stone-100 active:bg-stone-200">‹</button>
                <div className="text-center">
                  <div className="display font-bold text-sm">{shortHR(weekStart)} – {shortHR(addDays(weekStart, 6))}</div>
                  <div className="text-[11px] text-stone-500">{isThisWeek ? "ovaj tjedan" : <button onClick={() => setWeekStart(mondayOf(new Date()))} className="text-sky-600 underline">→ ovaj tjedan</button>}</div>
                </div>
                <button onClick={() => setWeekStart(addDays(weekStart, 7))} className="px-3 py-2 rounded-lg bg-stone-100 active:bg-stone-200">›</button>
              </div>
              <div className="px-4 pt-3">
                <button onClick={printWeek} className="w-full bg-stone-800 text-white py-2.5 rounded-xl text-sm font-semibold">🖨 Printaj ovaj tjedan</button>
                {canEdit && <button onClick={copyPrevWeek} className="w-full mt-2 bg-stone-200 text-stone-800 py-2 rounded-xl text-sm">Kopiraj prošli tjedan</button>}
              </div>

              <div className="px-3 py-3 space-y-3 pb-40">
                <div className="bg-white rounded-md border border-stone-300 p-2 pt-4 shadow-md relative mt-2" style={{ transform: "rotate(-0.6deg)" }}>
                  <Tape style={{ left: "12%", transform: "rotate(-5deg)" }} /><Tape style={{ right: "10%", transform: "rotate(4deg)" }} />
                  <WeekGrid weekStart={weekStart} week={week} extraSlots={extraSlots} nameOf={nameOf} onLeave={onLeave} canEdit={canEdit} onCell={openCell} onAddSlot={addSlot} />
                  {Array.from({ length: 7 }, (_, i) => holidayFor(key(addDays(weekStart, i)))).filter(Boolean).map((h) => <div key={h.date} className="text-[11px] mt-1 text-emerald-700">★ {shortHR(parseIso(h.date))} {h.name}{h.closed ? " — zatvoreno" : " — +50%"}</div>)}
                </div>

                <div className="bg-white rounded-2xl border border-stone-200 p-4 shadow-sm">
                  <div className="display font-bold mb-2 flex items-center gap-1.5"><Paw size={14} />Pregled tjedna</div>
                  {summary.some((p) => p.conflicts.length) && (
                    <div className="mb-3 text-xs bg-red-50 border border-red-200 text-red-700 rounded-lg p-2">⚠ Kasna smjena → rana sljedeći dan:
                      {summary.filter((p) => p.conflicts.length).map((p) => <div key={p.id}>• {p.name}: {p.conflicts.map((d) => `${DAYS[d]}→${DAYS[d + 1]}`).join(", ")}</div>)}
                    </div>
                  )}
                  <div className="grid grid-cols-2 gap-x-4 gap-y-1 text-sm">
                    {summary.filter((p) => p.count > 0).map((p) => <div key={p.id} className="flex justify-between"><span>{p.name}{p.holiday > 0 && <span className="text-emerald-600 text-[11px]"> +50%×{p.holiday}</span>}</span><span className="text-stone-500">{p.count} sm.{p.hours > 0 ? ` · ${Math.round(p.hours * 10) / 10} h` : ""}</span></div>)}
                  </div>
                </div>

                <div className="bg-white rounded-2xl border border-stone-200 p-4 shadow-sm">
                  <div className="display font-bold mb-2 flex items-center gap-1.5"><Paw size={14} />Napomene (svi vide i pišu)</div>
                  <textarea value={notes} onChange={(e) => setNotes(e.target.value)} onFocus={() => (notesFocused.current = true)} onBlur={() => { notesFocused.current = false; saveNotes(); }}
                    placeholder="npr. Roko mijenja Enu u srijedu.." className="w-full h-28 text-sm border border-stone-200 rounded-lg p-2 focus:outline-none focus:border-stone-400 resize-none" style={{ fontFamily: "system-ui,sans-serif" }} />
                  <button onClick={saveNotes} className="mt-2 text-xs bg-stone-800 text-white px-3 py-2 rounded-lg">Spremi napomene</button>
                </div>
              </div>
            </>
          ) : tab === "zamjene" ? (
            <div className="px-3 py-3 space-y-3 pb-40">
              <div className="bg-white rounded-2xl border border-stone-200 p-4 shadow-sm">
                <div className="display font-bold mb-1">Nova zamjena</div>
                <div className="text-[11px] text-stone-500 mb-3">Aktivira se čim druga strana potvrdi — bez admina.</div>
                <label className="text-[11px] text-stone-400">Tko daje smjenu</label>
                <select value={swapDraft.fromPerson || (me !== "__viewer" ? idOfName(me) : "")} onChange={(e) => setSwapDraft({ ...swapDraft, fromPerson: e.target.value })} className="w-full border border-stone-300 rounded-lg px-2 py-2 text-sm mb-2">
                  <option value="">—</option>{roster.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
                </select>
                <div className="flex gap-2 mb-2">
                  <input type="date" value={swapDraft.fromDate || ""} onChange={(e) => setSwapDraft({ ...swapDraft, fromDate: e.target.value })} className="flex-1 border border-stone-300 rounded-lg px-2 py-2 text-sm" />
                </div>
                <label className="text-[11px] text-stone-400">Tko preuzima</label>
                <select value={swapDraft.toPerson || ""} onChange={(e) => setSwapDraft({ ...swapDraft, toPerson: e.target.value })} className="w-full border border-stone-300 rounded-lg px-2 py-2 text-sm mb-2">
                  <option value="">—</option>{roster.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
                </select>
                <label className="flex items-center gap-2 text-sm mb-2"><input type="checkbox" checked={!!swapDraft.mutual} onChange={(e) => setSwapDraft({ ...swapDraft, mutual: e.target.checked })} /> Uzajamna zamjena (i ja preuzimam njegovu)</label>
                {swapDraft.mutual && (
                  <div className="flex gap-2 mb-2">
                    <input type="date" value={swapDraft.toDate || ""} onChange={(e) => setSwapDraft({ ...swapDraft, toDate: e.target.value })} className="flex-1 border border-stone-300 rounded-lg px-2 py-2 text-sm" />
                  </div>
                )}
                <button onClick={() => { if (!swapDraft.fromPerson && me !== "__viewer") swapDraft.fromPerson = idOfName(me); createSwap(); }} className="w-full bg-stone-800 text-white py-2.5 rounded-xl text-sm font-semibold">Pošalji zahtjev</button>
              </div>

              {swaps.length === 0 ? <div className="text-center text-stone-400 text-sm py-6">Nema zahtjeva.</div> :
                swaps.map((sw) => {
                  const badge = sw.status === "done" ? "bg-emerald-100 text-emerald-700" : sw.status === "rejected" ? "bg-stone-200 text-stone-500" : "bg-amber-100 text-amber-800";
                  const txt = sw.status === "done" ? "potvrđeno ✓" : sw.status === "rejected" ? "odbijeno" : "čeka potvrdu";
                  return (
                    <div key={sw.id} className="bg-white rounded-2xl border border-stone-200 p-4 shadow-sm">
                      <div className="flex items-center justify-between mb-1">
                        <span className="text-sm font-semibold">{nameOf(sw.fromPerson)} → {nameOf(sw.toPerson)}</span>
                        <span className={`text-[11px] px-2 py-0.5 rounded-full ${badge}`}>{txt}</span>
                      </div>
                      <div className="text-xs text-stone-600">
                        Daje: {shortHR(parseIso(sw.fromDate))} {shiftName(sw.fromShift)}
                        {sw.mutual && sw.toDate ? ` ⇄ ${shortHR(parseIso(sw.toDate))} ${shiftName(sw.toShift)}` : ""}
                      </div>
                      {sw.status === "pending" && (
                        <div className="flex gap-2 mt-3">
                          <button onClick={() => confirmSwap(sw.id)} className="flex-1 bg-emerald-600 text-white py-2 rounded-lg text-sm">Potvrđujem ({nameOf(sw.toPerson)})</button>
                          <button onClick={() => rejectSwap(sw.id)} className="px-3 bg-stone-200 rounded-lg text-sm">Odbij</button>
                        </div>
                      )}
                      {sw.status !== "pending" && <button onClick={() => deleteSwap(sw.id)} className="mt-2 text-[11px] text-stone-400">obriši</button>}
                    </div>
                  );
                })}
            </div>
          ) : tab === "godisnji" ? (
            <div className="px-3 py-3 space-y-3 pb-40">
              <div className="text-xs text-stone-500 px-1">Stalni 20 radnih dana, učenici i vanjski 0. Brojač ne računa blagdane ni nedjelje.{!canEdit && " (uređuje admin)"}</div>
              {roster.map((p) => {
                const used = leaveUsed(p.id); const cap = roleDef(p.role).leave; const draft = leaveDraft[p.id] || {}; const over = cap != null && used > cap;
                return (
                  <div key={p.id} className="bg-white rounded-2xl border border-stone-200 p-4 shadow-sm">
                    <div className="flex items-center justify-between mb-2"><span className="display font-bold">{p.name} <span className="text-[11px] text-stone-400 font-normal">· {roleDef(p.role).label}</span></span>
                      {cap != null ? <span className={`text-sm font-bold ${over ? "text-red-600" : "text-stone-700"}`}>{used} / {cap}</span> : <span className="text-sm text-stone-500">{used} dana</span>}</div>
                    {(leave[p.id] || []).length > 0 && (
                      <div className="flex flex-wrap gap-1 mb-3 max-h-24 overflow-y-auto">
                        {(leave[p.id] || []).map((iso) => <button key={iso} onClick={() => removeLeaveDate(p.id, iso)} className="text-[11px] px-2 py-1 rounded-full bg-amber-100 text-amber-900">{iso.slice(8, 10)}.{iso.slice(5, 7)}.{canEdit ? " ✕" : ""}</button>)}
                      </div>
                    )}
                    {canEdit && (
                      <div className="flex flex-wrap gap-2 items-center">
                        <input type="date" value={draft.od || ""} onChange={(e) => setLeaveDraft({ ...leaveDraft, [p.id]: { ...draft, od: e.target.value } })} className="border border-stone-300 rounded-lg px-2 py-1.5 text-sm" />
                        <span className="text-stone-400 text-sm">–</span>
                        <input type="date" value={draft.do || ""} onChange={(e) => setLeaveDraft({ ...leaveDraft, [p.id]: { ...draft, do: e.target.value } })} className="border border-stone-300 rounded-lg px-2 py-1.5 text-sm" />
                        <button onClick={() => addLeave(p.id)} className="bg-stone-800 text-white px-3 py-1.5 rounded-lg text-sm">+ dodaj</button>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          ) : tab === "sati" ? (
            <SatiTab roster={roster} canEdit={canEdit} meId={idOfName(me)} leave={leave} flash={flash} />
          ) : tab === "kasa" ? (
            <BlagajnaTab roster={roster} me={me} meId={idOfName(me)} canEdit={canEdit} flash={flash} />
          ) : tab === "tim" ? (
            <div className="px-3 py-3 space-y-2 pb-40">
              {roster.map((p) => {
                const dte = daysTo(p.sanExpiry); const open = expanded === p.id;
                const sanBadge = p.sanExpiry == null || p.sanExpiry === "" ? null : dte < 0 ? ["ISTEKLA", "bg-red-600 text-white"] : dte <= 30 ? [`za ${dte} d`, "bg-amber-500 text-white"] : ["vrijedi", "bg-emerald-100 text-emerald-700"];
                return (
                  <div key={p.id} className="bg-white border border-stone-200 rounded-xl shadow-sm">
                    <button onClick={() => setExpanded(open ? null : p.id)} className="w-full flex items-center justify-between px-4 py-3">
                      <span className="text-sm">{p.name} <span className="text-[11px] text-stone-400">· {roleDef(p.role).label}</span></span>
                      <span className="flex items-center gap-2">{sanBadge && <span className={`text-[10px] px-2 py-0.5 rounded-full ${sanBadge[1]}`}>San. {sanBadge[0]}</span>}<span className="text-stone-400">{open ? "▾" : "›"}</span></span>
                    </button>
                    {open && (
                      <div className="px-4 pb-4 space-y-2" style={{ fontFamily: "system-ui,sans-serif" }}>
                        <Field label="Kontakt broj" type="tel" value={p.phone} onSave={(v) => updateMember(p.id, "phone", v)} disabled={!canEdit} />
                        <Field label="Email" type="email" value={p.email} onSave={(v) => updateMember(p.id, "email", v)} disabled={!canEdit} />
                        {canEdit && <Field label="Satnica (€ po satu) — za izračun u tabu Sati" value={p.rate} onSave={(v) => updateMember(p.id, "rate", v.trim())} />}
                        <div className="flex gap-2">
                          <div className="flex-1"><Field label="Sanitarna — izdana" type="date" value={p.sanIssued} onSave={(v) => updateMember(p.id, "sanIssued", v)} disabled={!canEdit} /></div>
                          <div className="flex-1"><Field label="Vrijedi do" type="date" value={p.sanExpiry} onSave={(v) => updateMember(p.id, "sanExpiry", v)} disabled={!canEdit} /></div>
                        </div>
                        {canEdit && (
                          <div className="flex justify-between items-center pt-1">
                            <select value={p.role} onChange={(e) => updateMember(p.id, "role", e.target.value)} className="border border-stone-300 rounded-lg px-2 py-1.5 text-sm">{ROLES.map((r) => <option key={r.id} value={r.id}>{r.label}</option>)}</select>

function Field({ label, value, onSave, type, disabled }) {

      <label className="text-[11px] text-stone-400">{label}</label>

// ---------- tjedni raspored kao tablica (kao papirnati: dani u stupcima, termini u redovima) ----------
const BASE_SLOTS = [["11:00", "16:00", ""], ["11:00", "13:00", ""], ["16:00", "22:00", ""]];
const slotKey = (s) => `${s[0]}|${s[1]}|${s[2] || ""}`;
const hh = (t) => (t || "").replace(/^0/, "").replace(":00", "");
function parseSlot(txt) {
  const m = /^\s*(\d{1,2})(?:[:.](\d{2}))?\s*[-–]\s*(\d{1,2})(?:[:.](\d{2}))?\s*h?\s*(.*)$/.exec(txt || "");
  if (!m) return null;
  const t = (h, mi) => `${String(h).padStart(2, "0")}:${mi || "00"}`;
  return [t(m[1], m[2]), t(m[3], m[4]), (m[5] || "").trim()];
}
function WeekGrid({ weekStart, week, extraSlots, nameOf, onLeave, canEdit, onCell, onAddSlot, print }) {
  const slots = [...BASE_SLOTS];
  const seen = new Set(slots.map(slotKey));
  const more = [];
  [...Object.values(week).flat().map((it) => [it.from, it.to, it.label || ""]), ...(extraSlots || [])].forEach((s) => { const k = slotKey(s); if (!seen.has(k)) { seen.add(k); more.push(s); } });
  more.sort((a, b) => (mins(a[0]) ?? 9999) - (mins(b[0]) ?? 9999) || (mins(b[1]) ?? 0) - (mins(a[1]) ?? 0));
  slots.push(...more);
  const bd = print ? "1px solid #000" : "1.5px solid #1c1917";
  return (
    <div className="paper bg-white text-stone-900" style={{ fontFamily: "'Patrick Hand',system-ui,sans-serif" }}>
      <div className="flex items-end justify-between px-1 mb-1">
        <div className="flex items-end gap-0.5"><CatSit size={print ? 34 : 30} /><CatSit size={print ? 26 : 22} white style={{ marginBottom: 1 }} /></div>
        <div className="text-[15px] leading-none pb-1">Cat Caffe raspored</div>
        <div className="flex items-end gap-1"><Soot size={print ? 22 : 18} style={{ marginBottom: 4 }} /><CatFace size={print ? 36 : 30} /></div>
      </div>
      <table className="w-full" style={{ borderCollapse: "collapse", tableLayout: "fixed" }}>
        <thead>
          <tr>
            <th style={{ width: print ? 90 : 40 }} className="text-left align-bottom pb-1 text-[13px] leading-tight font-normal">{shortHR(weekStart).replace(/^0/, "").replace(".0", ".")}–<br />{shortHR(addDays(weekStart, 6)).replace(/^0/, "").replace(".0", ".")}</th>
            {DAYS.map((d, i) => {
              const iso = key(addDays(weekStart, i)); const h = holidayFor(iso);
              return <th key={i} style={{ border: bd }} className={`py-1 text-[12px] font-normal uppercase leading-tight ${h ? (h.closed ? "bg-red-100" : "bg-emerald-50") : ""}`}>{d}<div className="text-[10px] text-stone-500 normal-case">{shortHR(addDays(weekStart, i))}{h ? " ★" : ""}</div></th>;
            })}
          </tr>
        </thead>
        <tbody>
          {slots.map((sl) => {
            const k = slotKey(sl);
            return (
              <tr key={k}>
                <td className="text-[12px] leading-tight pr-0.5 align-middle">{hh(sl[0])}–{hh(sl[1])}h{sl[2] && <div className="text-[11px] text-stone-500">{sl[2]}</div>}</td>
                {DAYS.map((d, i) => {
                  const iso = key(addDays(weekStart, i)); const h = holidayFor(iso);
                  const items = week[i].filter((it) => slotKey([it.from, it.to, it.label || ""]) === k);
                  const closed = h && h.closed;
                  const body = closed ? <span className="text-[10px] text-red-500">zatv.</span> : items.map((it) => (
                    <div key={it.id}>
                      {it.people.map((pid) => { const nm = nameOf(pid); return <div key={pid} style={{ fontSize: print ? 14 : nm.length > 7 ? 11 : nm.length > 5 ? 12.5 : 14, whiteSpace: "nowrap", letterSpacing: nm.length > 7 ? -0.3 : 0 }} className={`leading-[1.15] overflow-hidden ${onLeave(pid, iso) ? "line-through text-amber-700" : ""}`}>{nm}</div>; })}
                      {it.note && <div className="text-[10px] text-stone-500 leading-tight">{it.note}</div>}
                    </div>
                  ));
                  return (
                    <td key={i} style={{ border: bd, height: print ? 44 : 50 }} className={`text-center align-middle px-0 py-0.5 text-[13px] overflow-hidden ${closed ? "bg-stone-100" : ""}`}>
                      {canEdit && !closed && !print ? <button onClick={() => onCell(i, sl, items[0], iso)} className="w-full h-full min-h-[44px] active:bg-amber-50">{items.some((it) => it.people.length || it.note) ? body : <Paw size={13} color="#e7e2da" style={{ margin: "0 auto" }} />}</button> : body}
                    </td>
                  );
                })}
              </tr>
            );
          })}
          {!print && (
            <tr>
              <td />
              {DAYS.map((d, i) => <td key={i} style={{ border: bd, height: 40 }} />)}
            </tr>
          )}
        </tbody>
      </table>
      {canEdit && !print && <button onClick={onAddSlot} className="mt-2 text-[13px] text-sky-700" style={{ fontFamily: "system-ui,sans-serif" }}>+ dodaj termin (npr. 14–20, 19–22 kviz)</button>}
    </div>
  );
}

// ---------- slike (R1 računi, doznake…) — spremaju se na ovaj uređaj ----------
function photoDb() {
  return new Promise((res, rej) => { const r = indexedDB.open("catcafe_photos", 1); r.onupgradeneeded = () => r.result.createObjectStore("p"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}
async function photoTx(mode, fn) {
  const db = await photoDb();
  return new Promise((res, rej) => { const tx = db.transaction("p", mode); const out = fn(tx.objectStore("p")); tx.oncomplete = () => res(out && out.result); tx.onerror = () => rej(tx.error); });
}
const photoPut = (id, blob) => photoTx("readwrite", (st) => { st.put(blob, id); });
const photoGet = (id) => photoTx("readonly", (st) => st.get(id));
const photoDel = (id) => photoTx("readwrite", (st) => { st.delete(id); });
function shrinkImage(file) {
  return new Promise((res) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height)); const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); c.toBlob((b) => res(b || file), "image/jpeg", 0.8);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}
function Thumb({ id, onOpen, onRemove }) {
  const [url, setUrl] = useState(null);
  useEffect(() => { let u; photoGet(id).then((b) => { if (b) { u = URL.createObjectURL(b); setUrl(u); } }).catch(() => {}); return () => { if (u) URL.revokeObjectURL(u); }; }, [id]);
  return (
    <span className="relative inline-block">
      <button onClick={() => url && onOpen(url)} className="w-14 h-14 rounded-lg border border-stone-300 bg-stone-100 overflow-hidden block">{url ? <img src={url} className="w-full h-full object-cover" /> : <span className="text-[10px] text-stone-400">nema</span>}</button>
      {onRemove && <button onClick={onRemove} className="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-red-600 text-white text-[10px] leading-5">✕</button>}
    </span>
  );
}
function Photos({ ids, onChange, canEdit, label }) {
  const [view, setView] = useState(null);
  const [busy, setBusy] = useState(false);
  async function add(files) {
    setBusy(true); const added = [];
    for (const f of Array.from(files || [])) { try { const id = "ph" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); await photoPut(id, await shrinkImage(f)); added.push(id); } catch (e) {} }
    setBusy(false); if (added.length) onChange([...(ids || []), ...added]);
  }
  function remove(id) { if (!confirm("Obrisati sliku?")) return; photoDel(id).catch(() => {}); onChange((ids || []).filter((x) => x !== id)); }
  return (
    <div className="flex flex-wrap gap-2 items-center">
      {(ids || []).map((id) => <Thumb key={id} id={id} onOpen={setView} onRemove={canEdit ? () => remove(id) : null} />)}
      {canEdit && (
        <label className="w-14 h-14 rounded-lg border-2 border-dashed border-stone-300 text-stone-500 flex flex-col items-center justify-center text-[10px] cursor-pointer">
          <span className="text-lg leading-none">📷</span>{busy ? "…" : label || "slikaj"}
          <input type="file" accept="image/*" multiple className="hidden" onChange={(e) => { add(e.target.files); e.target.value = ""; }} />
        </label>
      )}
      {view && (
        <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-2" onClick={() => setView(null)}>
          <img src={view} className="max-w-full max-h-full" />
        </div>
      )}
    </div>
  );
}

// ---------- mjesec, novac ----------
const MONTHS = ["Siječanj", "Veljača", "Ožujak", "Travanj", "Svibanj", "Lipanj", "Srpanj", "Kolovoz", "Rujan", "Listopad", "Studeni", "Prosinac"];
const ymOf = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
function addMonth(ym, k) { const [y, m] = ym.split("-").map(Number); return ymOf(new Date(y, m - 1 + k, 1)); }
function monthDays(ym) { const [y, m] = ym.split("-").map(Number); const n = new Date(y, m, 0).getDate(); return Array.from({ length: n }, (_, i) => `${ym}-${String(i + 1).padStart(2, "0")}`); }
const monthName = (ym) => `${MONTHS[+ym.slice(5, 7) - 1]} ${ym.slice(0, 4)}.`;
const num = (v) => { const x = parseFloat(String(v ?? "").replace(",", ".")); return isNaN(x) ? 0 : x; };
const eur = (n) => n.toLocaleString("hr-HR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
const money = (n) => n.toLocaleString("hr-HR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const hrs = (n) => (Math.round(n * 100) / 100).toLocaleString("hr-HR");
const bonusDay = (iso) => { const h = holidayFor(iso); return parseIso(iso).getDay() === 0 || !!(h && !h.closed); };
function MonthNav({ ym, setYm }) {
  return (
    <div className="px-4 py-3 flex items-center justify-between bg-white border-b border-stone-200">
      <button onClick={() => setYm(addMonth(ym, -1))} className="px-3 py-2 rounded-lg bg-stone-100 active:bg-stone-200">‹</button>
      <div className="display font-bold text-sm flex items-end gap-1.5"><CatSit size={18} />{monthName(ym)}<Soot size={13} /></div>
      <button onClick={() => setYm(addMonth(ym, 1))} className="px-3 py-2 rounded-lg bg-stone-100 active:bg-stone-200">›</button>
    </div>
  );
}
const dd = (iso) => `${iso.slice(8, 10)}.`;

// ---------- SATI: sati iz rasporeda, +50% nedjelja/blagdan, bolovanje 70% / 0% ----------
function SatiTab({ roster, canEdit, meId, leave, flash }) {
  const [ym, setYm] = useState(() => ymOf(new Date()));
  const [weeks, setWeeks] = useState({});
  const [sick, setSick] = useState([]);
  const [draft, setDraft] = useState({ doznaka: true, hpd: "6" });
  useEffect(() => {
    (async () => {
      const ks = [...new Set(monthDays(ym).map((d) => key(mondayOf(parseIso(d)))))]; const o = {};
      for (const k of ks) { const r = await sGet(`week:${k}`); o[k] = weekFrom(r, k, roster); }
      setWeeks(o);
      const sr = await sGet("sick"); try { setSick(sr ? JSON.parse(sr) : []); } catch (e) {}
    })();
  }, [ym]);
  async function saveSick(next) { setSick(next); await sSet("sick", JSON.stringify(next)); flash("bolovanje ✓"); }
  function addSick() {
    if (!draft.pid || !draft.od) { flash("odaberi osobu i datum"); return; }
    const to = draft.do || draft.od; if (to < draft.od) { flash("krivi datumi"); return; }
    saveSick([{ id: "b" + Date.now(), pid: draft.pid, od: draft.od, do: to, doznaka: !!draft.doznaka, hpd: draft.hpd || "0", photos: [] }, ...sick]);
    setDraft({ doznaka: true, hpd: draft.hpd });
  }
  const updSick = (id, patch) => saveSick(sick.map((x) => (x.id === id ? { ...x, ...patch } : x)));

  const days = monthDays(ym);
  const people = canEdit ? roster : roster.filter((p) => p.id === meId);
  const itemsOn = (iso) => { const w = weeks[key(mondayOf(parseIso(iso)))]; return w ? w[dayIdxOf(iso)] : []; };
  const sickOn = (pid, iso) => sick.find((x) => x.pid === pid && iso >= x.od && iso <= x.do);
  // bolovanje se broji kao godišnji: bez nedjelja i blagdana
  const sickCounts = (iso) => parseIso(iso).getDay() !== 0 && !holidayFor(iso);
  function cell(pid, iso) {
    const b = sickOn(pid, iso); if (b) return { kind: "B", b, counts: sickCounts(iso) };
    if ((leave[pid] || []).includes(iso)) return { kind: "GO" };
    const h = itemsOn(iso).filter((it) => it.people.includes(pid)).reduce((a, it) => a + itemHours(it), 0);
    return { kind: "W", h, bonus: bonusDay(iso) };
  }
  const tot = {};
  people.forEach((p) => {
    const t = { h: 0, b: 0, s70: 0, s70d: 0, s0d: 0, go: 0 };
    days.forEach((iso) => {
      const c = cell(p.id, iso);
      if (c.kind === "W") { t.h += c.h; if (c.bonus) t.b += c.h; }
      else if (c.kind === "GO") t.go++;
      else if (c.counts) { if (c.b.doznaka) { t.s70 += num(c.b.hpd); t.s70d++; } else t.s0d++; }
    });
    t.obr = t.h + 0.5 * t.b + 0.7 * t.s70; t.eur = num(p.rate) ? t.obr * num(p.rate) : null;
    tot[p.id] = t;
  });
  const foot = [
    ["Ukupno sati", (t) => hrs(t.h)],
    ["od toga nedjelja/blagdan (+50%)", (t) => hrs(t.b)],
    ["Bolovanje s doznakom (70%)", (t) => (t.s70d ? `${t.s70d} d · ${hrs(t.s70)} h` : "0")],
    ["Bolovanje bez doznake (0%)", (t) => (t.s0d ? `${t.s0d} d` : "0")],
    ["Godišnji", (t) => (t.go ? `${t.go} d` : "0")],
    ["Obračunski sati", (t) => <b>{hrs(t.obr)}</b>],
    ...(canEdit ? [["Iznos (satnica iz taba Tim)", (t) => (t.eur == null ? <span className="text-stone-400">upiši satnicu</span> : <b>{eur(t.eur)}</b>)]] : []),
  ];
  const monthSick = sick.filter((x) => x.do >= days[0] && x.od <= days[days.length - 1] && (canEdit || x.pid === meId));
  const nameOf = (id) => (roster.find((r) => r.id === id) || {}).name || "?";
  if (!people.length) return <div className="p-8 text-center text-stone-400 text-sm">Sati vidi samo prijavljena osoba (ili admin za sve).</div>;
  return (
    <div className="pb-40">
      <MonthNav ym={ym} setYm={setYm} />
      <div className="px-4 py-2 text-[11px] text-stone-500">Sati se sami zbrajaju iz rasporeda. <b className="text-emerald-700">Zeleno</b> = nedjelja ili blagdan (+50%). <b className="text-red-600">B</b> = bolovanje (70% s doznakom, 0% bez). GO = godišnji.<br />Obračunski sati = sati + 50% sati nedjeljom/blagdanom + 70% sati bolovanja s doznakom.</div>
      <div className="overflow-x-auto mx-3 bg-white rounded-2xl border border-stone-200 shadow-sm">
        <table className="text-xs border-collapse min-w-full" style={{ fontFamily: "system-ui,sans-serif" }}>
          <thead><tr className="bg-stone-100"><th className="sticky left-0 bg-stone-100 px-2 py-2 text-left">Dan</th>{people.map((p) => <th key={p.id} className="px-2 py-2 whitespace-nowrap">{p.name}</th>)}</tr></thead>
          <tbody>
            {days.map((iso) => {
              const wd = (parseIso(iso).getDay() + 6) % 7; const h = holidayFor(iso); const bd = bonusDay(iso);
              return (
                <tr key={iso} className={`border-t border-stone-100 ${bd ? "bg-emerald-50" : ""}`}>
                  <td className={`sticky left-0 px-2 py-1.5 whitespace-nowrap ${bd ? "bg-emerald-50 text-emerald-800" : "bg-white"}`}>{dd(iso)} {DAYS[wd]}{h ? " ★" : ""}</td>
                  {people.map((p) => {
                    const c = cell(p.id, iso);
                    return <td key={p.id} className="px-2 py-1.5 text-center">{c.kind === "B" ? <span className={`font-bold ${c.b.doznaka ? "text-red-600" : "text-stone-400"}`}>B{c.b.doznaka ? "" : " 0%"}</span> : c.kind === "GO" ? <span className="text-amber-700">GO</span> : c.h ? <span className={c.bonus ? "font-bold text-emerald-700" : ""}>{hrs(c.h)}</span> : <span className="text-stone-300">·</span>}</td>;
                  })}
                </tr>
              );
            })}
          </tbody>
          <tfoot>
            {foot.map(([label, f]) => (
              <tr key={label} className="border-t border-stone-300 bg-stone-50"><td className="sticky left-0 bg-stone-50 px-2 py-1.5 text-[11px]">{label}</td>{people.map((p) => <td key={p.id} className="px-2 py-1.5 text-center whitespace-nowrap">{f(tot[p.id])}</td>)}</tr>
            ))}
          </tfoot>
        </table>
      </div>

      <div className="mx-3 mt-3 bg-white rounded-2xl border border-stone-200 p-4 shadow-sm">
        <div className="display font-bold mb-2 flex items-center gap-1.5"><Paw size={14} />Bolovanja</div>
        {monthSick.length === 0 && <div className="text-sm text-stone-400 mb-2">Nema bolovanja u ovom mjesecu.</div>}
        {monthSick.map((x) => (
          <div key={x.id} className="border-t border-stone-100 py-2">
            <div className="flex items-center justify-between text-sm">
              <span>{nameOf(x.pid)} · {shortHR(parseIso(x.od))}–{shortHR(parseIso(x.do))}</span>
              <span className={`text-[11px] px-2 py-0.5 rounded-full ${x.doznaka ? "bg-red-100 text-red-700" : "bg-stone-200 text-stone-600"}`}>{x.doznaka ? "doznaka · 70%" : "bez doznake · 0%"}</span>
            </div>
            {canEdit && (
              <div className="flex items-center gap-3 text-xs mt-1">
                <label className="flex items-center gap-1"><input type="checkbox" checked={!!x.doznaka} onChange={(e) => updSick(x.id, { doznaka: e.target.checked })} /> ima doznaku</label>
                <label className="flex items-center gap-1">sati/dan <input value={x.hpd} inputMode="decimal" onChange={(e) => updSick(x.id, { hpd: e.target.value })} className="w-12 border border-stone-300 rounded px-1 py-0.5" /></label>
                <button onClick={() => { if (confirm("Obrisati bolovanje?")) saveSick(sick.filter((y) => y.id !== x.id)); }} className="text-red-500 ml-auto">obriši</button>
              </div>
            )}
            <div className="mt-2"><Photos ids={x.photos} canEdit={canEdit} label="doznaka" onChange={(ph) => updSick(x.id, { photos: ph, doznaka: ph.length ? true : x.doznaka })} /></div>
          </div>
        ))}
        {canEdit && (
          <div className="border-t border-stone-200 pt-3 mt-2 space-y-2" style={{ fontFamily: "system-ui,sans-serif" }}>
            <select value={draft.pid || ""} onChange={(e) => setDraft({ ...draft, pid: e.target.value })} className="w-full border border-stone-300 rounded-lg px-2 py-2 text-sm"><option value="">tko je na bolovanju</option>{roster.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}</select>
            <div className="flex gap-2 items-center">
              <input type="date" value={draft.od || ""} onChange={(e) => setDraft({ ...draft, od: e.target.value })} className="flex-1 border border-stone-300 rounded-lg px-2 py-1.5 text-sm" />–
              <input type="date" value={draft.do || ""} onChange={(e) => setDraft({ ...draft, do: e.target.value })} className="flex-1 border border-stone-300 rounded-lg px-2 py-1.5 text-sm" />
            </div>
            <div className="flex gap-3 items-center text-sm">
              <label className="flex items-center gap-1"><input type="checkbox" checked={!!draft.doznaka} onChange={(e) => setDraft({ ...draft, doznaka: e.target.checked })} /> ima doznaku</label>
              <label className="flex items-center gap-1">sati/dan <input value={draft.hpd} inputMode="decimal" onChange={(e) => setDraft({ ...draft, hpd: e.target.value })} className="w-12 border border-stone-300 rounded px-1 py-1" /></label>
              <button onClick={addSick} className="ml-auto bg-stone-800 text-white px-3 py-1.5 rounded-lg">+ dodaj</button>
            </div>
            <div className="text-[11px] text-stone-400">Sliku doznake dodaš nakon spremanja (📷 ispod bolovanja).</div>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- BLAGAJNA: promet (gotovina/kartice), manjak, višak, bakšiš; pozajmice, povrati, trgovina, računi ----------
const KASA_TYPES = [
  { id: "pozajmica", label: "Pozajmica iz blagajne", person: true },
  { id: "povrat", label: "Povrat u blagajnu", person: true },
  { id: "trgovina", label: "Plaćanje u trgovini", pay: true },
  { id: "dokument", label: "Samo dokument / račun", noAmount: true },
];
const kasaDef = (id) => KASA_TYPES.find((t) => t.id === id) || KASA_TYPES[KASA_TYPES.length - 1];
const DAY_FIELDS = [["got", "Gotovina"], ["kar", "Kartice"], ["manjak", "Manjak"], ["visak", "Višak"], ["baksis", "Bakšiš"]];
function BlagajnaTab({ roster, me, meId, canEdit, flash }) {
  const [ym, setYm] = useState(() => ymOf(new Date()));
  const [list, setList] = useState([]);
  const [days, setDays] = useState({});
  const [day, setDay] = useState(null);
  const [dayDraft, setDayDraft] = useState({});
  const [draft, setDraft] = useState({ type: "trgovina", pay: "gotovina" });
  const canAdd = me && me !== "__viewer";
  useEffect(() => {
    (async () => {
      const [r, d] = await Promise.all([sGet("kasa"), sGet("blagajna")]);
      try { setList(r ? JSON.parse(r).filter((e) => KASA_TYPES.some((t) => t.id === e.type)) : []); } catch (e) {}
      try { setDays(d ? JSON.parse(d) : {}); } catch (e) {}
    })();
  }, []);
  async function save(next) { setList(next); await sSet("kasa", JSON.stringify(next)); }
  function openDay(iso) { setDay(iso); const d = days[iso] || {}; setDayDraft(Object.fromEntries(DAY_FIELDS.map(([k]) => [k, d[k] ? String(d[k]).replace(".", ",") : ""]))); }
  async function saveDay() {
    if (!canAdd) return;
    const rec = Object.fromEntries(DAY_FIELDS.map(([k]) => [k, num(dayDraft[k])]));
    const next = { ...days, [day]: { ...rec, by: me, ts: Date.now() } };
    setDays(next); await sSet("blagajna", JSON.stringify(next)); flash("blagajna ✓");
  }
  const nameOf = (id) => (roster.find((r) => r.id === id) || {}).name || "";
  function add() {
    const t = kasaDef(draft.type); const amount = num(draft.amount);
    if (!t.noAmount && !(amount > 0)) { flash("upiši iznos"); return; }
    if (t.person && !(draft.pid || meId)) { flash("odaberi osobu"); return; }
    const e = { id: "k" + Date.now(), date: day, type: t.id, amount: t.noAmount ? 0 : amount, pid: t.person ? draft.pid || meId : "", pay: t.pay ? draft.pay || "gotovina" : "", note: (draft.note || "").trim(), photos: draft.photos || [], by: me, ts: Date.now() };
    save([...list, e]); setDraft({ type: draft.type, pay: draft.pay }); flash("spremljeno ✓");
  }
  const upd = (id, patch) => save(list.map((x) => (x.id === id ? { ...x, ...patch } : x)));
  const mdays = monthDays(ym);
  const inMonth = list.filter((e) => e.date && e.date.startsWith(ym));
  const sumOf = (arr, f) => arr.filter(f).reduce((a, e) => a + num(e.amount), 0);
  const dv = (iso, k) => num((days[iso] || {})[k]);
  const COLS = [
    ["Gotovina", (iso) => dv(iso, "got")],
    ["Kartice", (iso) => dv(iso, "kar")],
    ["Ukupno", (iso) => dv(iso, "got") + dv(iso, "kar"), true],
    ["Manjak", (iso) => dv(iso, "manjak")],
    ["Višak", (iso) => dv(iso, "visak")],
    ["Bakšiš", (iso) => dv(iso, "baksis")],
    ["Pozajm.", (iso) => sumOf(inMonth, (e) => e.date === iso && e.type === "pozajmica")],
    ["Povrat", (iso) => sumOf(inMonth, (e) => e.date === iso && e.type === "povrat")],
    ["Trgovina", (iso) => sumOf(inMonth, (e) => e.date === iso && e.type === "trgovina")],
  ];
  const balances = roster.map((p) => ({ p, d: sumOf(list, (e) => e.pid === p.id && e.type === "pozajmica") - sumOf(list, (e) => e.pid === p.id && e.type === "povrat") })).filter((x) => Math.abs(x.d) > 0.001);
  const dayList = day ? list.filter((e) => e.date === day) : [];
  const t = kasaDef(draft.type);
  const bd = "1.5px solid #1c1917";
  const totalDraft = num(dayDraft.got) + num(dayDraft.kar);
  return (
    <div className="pb-40">
      <MonthNav ym={ym} setYm={setYm} />
      <div className="px-4 py-2 text-[11px] text-stone-500">Tapni dan za unos prometa, manjka, viška, bakšiša i računa. Iznosi u €. 📎 = broj slika.</div>
      <div className="overflow-x-auto mx-3 bg-white rounded-2xl border border-stone-200 shadow-sm p-2">
        <table className="text-[12px] min-w-full" style={{ borderCollapse: "collapse", fontFamily: "system-ui,sans-serif" }}>
          <thead><tr><th className="sticky left-0 bg-white px-2 py-1.5 text-left" style={{ border: bd }}>Dan</th>{COLS.map(([l, , strong]) => <th key={l} style={{ border: bd }} className={`px-2 py-1.5 whitespace-nowrap ${strong ? "bg-amber-50" : ""}`}>{l}</th>)}<th style={{ border: bd }} className="px-2">📎</th></tr></thead>
          <tbody>
            {mdays.map((iso) => {
              const wd = (parseIso(iso).getDay() + 6) % 7; const ph = inMonth.filter((e) => e.date === iso).reduce((a, e) => a + (e.photos || []).length, 0);
              return (
                <tr key={iso} onClick={() => openDay(iso)} className="active:bg-amber-50 cursor-pointer">
                  <td className="sticky left-0 bg-white px-2 py-1.5 whitespace-nowrap" style={{ border: bd }}>{dd(iso)} {DAYS[wd]}</td>
                  {COLS.map(([l, f, strong]) => { const v = f(iso); return <td key={l} style={{ border: bd }} className={`px-2 py-1.5 text-right whitespace-nowrap ${strong ? "bg-amber-50 font-bold" : ""} ${l === "Manjak" && v ? "text-red-600" : ""}`}>{v ? money(v) : ""}</td>; })}
                  <td style={{ border: bd }} className="px-2 text-center">{ph || ""}</td>
                </tr>
              );
            })}
          </tbody>
          <tfoot><tr className="font-bold bg-stone-100"><td className="sticky left-0 bg-stone-100 px-2 py-2" style={{ border: bd }}>Ukupno</td>{COLS.map(([l, f]) => <td key={l} style={{ border: bd }} className="px-2 py-2 text-right whitespace-nowrap">{money(mdays.reduce((a, iso) => a + f(iso), 0))}</td>)}<td style={{ border: bd }} /></tr></tfoot>
        </table>
      </div>
      <div className="mx-3 mt-3 bg-white rounded-2xl border border-stone-200 p-4 shadow-sm">
        <div className="display font-bold mb-1 flex items-center gap-1.5"><Paw size={14} />Pozajmice — tko još duguje blagajni</div>
        {balances.length === 0 ? <div className="text-sm text-stone-400">Nitko ne duguje.</div> :
          balances.map(({ p, d }) => <div key={p.id} className="flex justify-between text-sm"><span>{p.name}</span><span className={d > 0 ? "text-red-600 font-bold" : "text-emerald-700"}>{d > 0 ? `duguje ${eur(d)}` : `preplatio ${eur(-d)}`}</span></div>)}
      </div>

      {day && (
        <div className="fixed inset-0 z-30 flex items-end" onClick={() => setDay(null)}>
          <div className="absolute inset-0 bg-black/40" />
          <div className="relative w-full bg-white rounded-t-3xl max-h-[88vh] overflow-y-auto p-4" onClick={(e) => e.stopPropagation()} style={{ fontFamily: "system-ui,sans-serif" }}>
            <div className="flex items-center justify-between mb-3"><div className="display font-bold">{DAYS_LONG[dayIdxOf(day)]} {shortHR(parseIso(day))}</div><button onClick={() => setDay(null)} className="text-stone-400 text-xl px-2">✕</button></div>
            <div className="border border-stone-300 rounded-xl p-3 mb-3">
              <div className="text-[11px] uppercase tracking-wide text-stone-400 mb-2">Blagajna</div>
              <div className="grid grid-cols-2 gap-2">
                {DAY_FIELDS.map(([k, label]) => (
                  <label key={k} className={k === "baksis" ? "col-span-2" : ""}><span className="text-[11px] text-stone-500">{label} €</span>
                    <input value={dayDraft[k] || ""} disabled={!canAdd} inputMode="decimal" onChange={(e) => setDayDraft({ ...dayDraft, [k]: e.target.value })} className="w-full border border-stone-300 rounded-lg px-2 py-2 text-sm disabled:bg-stone-50" /></label>
                ))}
              </div>
              <div className="flex justify-between items-center mt-2 text-sm"><span>Ukupno (gotovina + kartice)</span><b>{eur(totalDraft)}</b></div>
              {(days[day] || {}).by && <div className="text-[10px] text-stone-400">zadnje upisao/la: {days[day].by}</div>}
              {canAdd && <button onClick={saveDay} className="w-full mt-2 bg-amber-500 text-stone-900 font-bold py-2.5 rounded-xl text-sm">Spremi blagajnu</button>}
            </div>
            {dayList.map((e) => {
              const mine = canEdit || e.by === me;
              return (
                <div key={e.id} className="border border-stone-200 rounded-xl p-3 mb-2">
                  <div className="flex justify-between text-sm">
                    <span><b>{kasaDef(e.type).label}</b>{e.pay ? ` · ${e.pay}` : ""}{e.pid ? ` · ${nameOf(e.pid)}` : ""}</span>
                    {!kasaDef(e.type).noAmount && <b>{eur(num(e.amount))}</b>}
                  </div>
                  {e.note && <div className="text-xs text-stone-500 mt-0.5">{e.note}</div>}
                  <div className="text-[10px] text-stone-400 mt-0.5">upisao/la: {e.by}</div>
                  <div className="mt-2 flex items-end justify-between gap-2">
                    <Photos ids={e.photos} canEdit={mine} label="račun" onChange={(ph) => upd(e.id, { photos: ph })} />
                    {mine && <button onClick={() => { if (confirm("Obrisati unos?")) save(list.filter((x) => x.id !== e.id)); }} className="text-xs text-red-500">obriši</button>}
                  </div>
                </div>
              );
            })}
            {canAdd ? (
              <div className="border-t border-stone-200 pt-3 mt-3 space-y-2">
                <div className="text-[11px] uppercase tracking-wide text-stone-400">Pozajmica, povrat, trgovina ili račun</div>
                <div className="flex flex-wrap gap-1.5">
                  {KASA_TYPES.map((k) => <button key={k.id} onClick={() => setDraft({ ...draft, type: k.id })} className={`text-xs px-2.5 py-1.5 rounded-lg border ${draft.type === k.id ? "bg-stone-800 text-white border-stone-800" : "bg-white border-stone-300"}`}>{k.label}</button>)}
                </div>
                {t.person && <select value={draft.pid || meId || ""} onChange={(e) => setDraft({ ...draft, pid: e.target.value })} className="w-full border border-stone-300 rounded-lg px-2 py-2 text-sm"><option value="">tko</option>{roster.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}</select>}
                {t.pay && (
                  <div className="flex gap-2">{["gotovina", "kartica"].map((m) => <button key={m} onClick={() => setDraft({ ...draft, pay: m })} className={`flex-1 py-2 rounded-lg text-sm border ${draft.pay === m ? "bg-stone-800 text-white border-stone-800" : "border-stone-300"}`}>{m === "kartica" ? "💳 kartica" : "💶 gotovina"}</button>)}</div>
                )}
                {!t.noAmount && <input value={draft.amount || ""} onChange={(e) => setDraft({ ...draft, amount: e.target.value })} inputMode="decimal" placeholder="iznos €" className="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm" />}
                <input value={draft.note || ""} onChange={(e) => setDraft({ ...draft, note: e.target.value })} placeholder="napomena (npr. Konzum, mlijeko)" className="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm" />
                <Photos ids={draft.photos} canEdit label={draft.type === "trgovina" ? "R1 račun" : "slikaj"} onChange={(ph) => setDraft({ ...draft, photos: ph })} />
                <button onClick={add} className="w-full bg-stone-800 text-white font-bold py-3 rounded-xl text-sm">Dodaj</button>
              </div>
            ) : <div className="text-xs text-stone-400">Za unos se prijavi svojim imenom.</div>}
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- setup + bootstrap ----------
function Setup({ onReady }) {
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [link, setLink] = useState("");
  async function make() {
    setBusy(true); setErr("");
    try {
      const res = await createStore({ roster: JSON.stringify(DEFAULT_ROSTER) });
      if (!res) throw new Error("noid");
      const url = location.origin + location.pathname + "?b=" + res.id + "&p=" + res.p;
      history.replaceState(null, "", url);
      try { localStorage.setItem("catcafe_last", JSON.stringify({ b: res.id, p: res.p })); } catch (e) {}
      if (res.p === "local") { onReady(); return; }
      setLink(url);
    } catch (e) { setErr("Ni jedna baza ne prolazi s ovog hosta. Pokušaj još jednom za par sekundi; ako i dalje ne ide, javi mi."); }
    setBusy(false);
  }
  return (
    <div className="min-h-screen bg-stone-900 text-stone-50 flex flex-col items-center justify-center p-6" style={{ fontFamily: "Georgia,serif" }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&display=swap');.display{font-family:'Fraunces',Georgia,serif}`}</style>
      <div className="flex items-end gap-2 mb-3"><CatSit size={52} white /><Soot size={30} style={{ marginBottom: 6 }} /><CatSit size={64} /><CatFace size={46} /></div>
      <div className="display text-2xl font-bold mb-1">Cat Cafe · Raspored</div>
      {!link ? (
        <>
          <div className="text-stone-400 text-sm mb-6 text-center max-w-xs">Prvi put: kreiraj timski raspored. Dobit ćeš jedan link koji dijeliš svima.</div>
          <button onClick={make} disabled={busy} className="px-6 py-3 rounded-xl bg-amber-500 text-stone-900 font-bold disabled:opacity-50">{busy ? "kreiram…" : "Kreiraj timski raspored"}</button>
          {err && <div className="text-red-400 text-xs mt-3 text-center max-w-xs">{err}</div>}
        </>
      ) : (
        <div className="w-full max-w-xs text-center">
          <div className="text-emerald-400 text-sm mb-2">Spremno ✓</div>
          <div className="text-stone-400 text-xs mb-2">Ovo je vaš zajednički link — pošalji ga timu. Svi ga otvaraju i dijele iste podatke:</div>
          <div className="bg-stone-800 border border-stone-600 rounded-lg p-2 text-[11px] break-all mb-2">{link}</div>
          <button onClick={() => { navigator.clipboard && navigator.clipboard.writeText(link); }} className="w-full py-2 rounded-xl bg-stone-700 text-stone-100 text-sm mb-2">Kopiraj link</button>
          <button onClick={onReady} className="w-full py-3 rounded-xl bg-amber-500 text-stone-900 font-bold">Otvori raspored</button>
        </div>
      )}
    </div>
  );
}

function Root() {
  const [phase, setPhase] = useState(BLOB_ID ? "app" : "setup");
  if (phase === "setup") return <Setup onReady={() => setPhase("app")} />;
  return <App />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);

</script>
</body>
</html>
